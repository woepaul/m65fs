# Builds the native m65 binary on every release platform and smoke-tests it. Used by ci.yml
# (just build and test) and release.yml (with a version, packaged and uploaded). Started by
# hand with a version (gh workflow run native.yml -f version=0.2.2-test1), it packages the
# archives as artifacts of the run, without a release: test builds, e.g. for Windows.
name: Native binaries

on:
  workflow_call:
    inputs:
      version:
        description: Release version (empty = keep the version in pom.xml, don't package)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Version for the test build (e.g. 0.2.2-test1); archives become artifacts
        type: string
        required: true

permissions:
  contents: read

jobs:
  native:
    name: native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux-amd64 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { os: macos-latest,     platform: macos-aarch64 }
          - { os: windows-latest,   platform: windows-amd64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: MSVC environment for native-image
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Maven (retried, Maven Central sometimes fails a download)
        run: for i in 1 2 3; do ./mvnw -B -q -v && exit 0; sleep 15; done; exit 1

      - name: Set the release version
        if: inputs.version != ''
        run: ./mvnw -B -q versions:set -DnewVersion="${{ inputs.version }}" -DgenerateBackupPoms=false

      - name: Build
        run: |
          set -o pipefail
          tools/build-native.sh 2>&1 | tee build.log

      - name: Show the end of the build log as an annotation (readable without signing in)
        if: failure()
        run: |
          msg=$(tail -n 60 build.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=build-native.sh (${{ matrix.platform }})::$msg"

      - name: Smoke test
        run: |
          bin=target/native/m65; [[ -f $bin.exe ]] && bin=$bin.exe
          "$bin" --version
          "$bin" --list-commands
          "$bin" help > /dev/null
          ls target/native

      - name: Package and check the archive
        run: |
          bin=target/native/m65; [[ -f $bin.exe ]] && bin=$bin.exe
          archive=$(tools/package-release.sh "${{ inputs.version || 'ci' }}")
          py=python3; command -v python3 >/dev/null || py=python
          $py tools/check-release-archive.py "$archive" $("$bin" --list-commands | tr -d '\r')

      - uses: actions/upload-artifact@v4
        if: inputs.version != ''
        with:
          name: m65-${{ matrix.platform }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
          if-no-files-found: error
