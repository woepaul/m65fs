# A tag vX.Y.Z publishes the release: the jar and the native binaries for Linux amd64 and
# aarch64, macOS aarch64 and Windows amd64, with the CHANGELOG.md section "## X.Y.Z" as notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag, and its changelog entry
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          tools/release-notes.sh "$v" > /dev/null
          echo "version=$v" >> "$GITHUB_OUTPUT"

  jar:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Tools for the image tests and the MEGA65 code
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dosfstools mtools acme
      - name: The bundled MEGA65 code matches its sources
        run: tools/build-blobs.sh && git diff --exit-code src/main/resources
      - name: Build and test
        run: |
          ./mvnw -B -q versions:set -DnewVersion="${{ needs.prepare.outputs.version }}" -DgenerateBackupPoms=false
          ./mvnw -B verify
          mkdir -p target/dist
          cp "target/m65fs-${{ needs.prepare.outputs.version }}.jar" target/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: m65fs-jar
          path: target/dist/*.jar
          if-no-files-found: error

  native:
    needs: prepare
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, jar, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.prepare.outputs.version }}"
          tools/release-notes.sh "$v" > notes.md
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "m65fs $v" --notes-file notes.md
