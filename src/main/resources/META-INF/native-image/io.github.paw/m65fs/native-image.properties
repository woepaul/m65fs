# Settings picked up automatically when the jar is compiled with native-image.
# The JDK's list of installed FileSystemProviders is built at image build time, which creates
# our provider then; its only state is an (empty) map of open file systems, so that is safe.
Args = --no-fallback \
       --initialize-at-build-time=io.github.paw.m65fs.nio.Mega65FileSystemProvider
